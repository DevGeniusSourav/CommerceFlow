server:
  port: 8081

spring:
  application:
    name: product-service

  datasource:
#    url: jdbc:postgresql://localhost:5432/commerceflow_product?options=-c%20TimeZone=Asia/Kolkata
    url: jdbc:postgresql://postgres:5432/commerceflow_product?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
#      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true