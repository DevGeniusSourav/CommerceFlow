name: CommerceFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build discovery service
        run: |
          cd discovery-server
          ./mvnw clean package -DskipTests

      - name: Build gateway service
        run: |
          cd gateway-service
          ./mvnw clean package -DskipTests

      - name: Build user service
        run: |
          cd user-service
          ./mvnw clean package -DskipTests

      - name: Build product service
        run: |
          cd product-service
          ./mvnw clean package -DskipTests

      - name: Build order service
        run: |
          cd order-service
          ./mvnw clean package -DskipTests

      - name: Build inventory service
        run: |
          cd inventory-service
          ./mvnw clean package -DskipTests

      - name: Build payment service
        run: |
          cd payment-service
          ./mvnw clean package -DskipTests