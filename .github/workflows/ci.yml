name: CommerceFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create databases
        env:
          PGPASSWORD: root
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE commerceflow_user;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE commerceflow_product;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE commerceflow_order;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE commerceflow_inventory;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE commerceflow_payment;"

      - name: Build discovery service
        run: |
          cd discovery-server
          ./mvnw clean package

      - name: Build gateway service
        run: |
          cd gateway-service
          ./mvnw clean package

      - name: Build user service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerceflow_user?options=-c%20TimeZone=Asia/Kolkata
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          EUREKA_CLIENT_ENABLED: false
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: |
          cd user-service
          ./mvnw clean package

      - name: Build product service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerceflow_product?options=-c%20TimeZone=Asia/Kolkata
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          EUREKA_CLIENT_ENABLED: false
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: |
          cd product-service
          ./mvnw clean package

      - name: Build order service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerceflow_order?options=-c%20TimeZone=Asia/Kolkata
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          EUREKA_CLIENT_ENABLED: false
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: |
          cd order-service
          ./mvnw clean package

      - name: Build inventory service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerceflow_inventory?options=-c%20TimeZone=Asia/Kolkata
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          EUREKA_CLIENT_ENABLED: false
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: |
          cd inventory-service
          ./mvnw clean package

      - name: Build payment service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerceflow_payment?options=-c%20TimeZone=Asia/Kolkata
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: root
          EUREKA_CLIENT_ENABLED: false
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: |
          cd payment-service
          ./mvnw clean package

      - name: Build Docker images
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for SERVICE in \
            discovery-server \
            gateway-service \
            user-service \
            product-service \
            order-service \
            inventory-service \
            payment-service
          do
            IMAGE_NAME="ghcr.io/$OWNER/commerceflow-$SERVICE"

            echo "Building $IMAGE_NAME"

            docker build \
              -t "$IMAGE_NAME:latest" \
              "./$SERVICE"
          done

      - name: Push Docker images
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for SERVICE in \
            discovery-server \
            gateway-service \
            user-service \
            product-service \
            order-service \
            inventory-service \
            payment-service
          do
            IMAGE_NAME="ghcr.io/$OWNER/commerceflow-$SERVICE"

            echo "Pushing $IMAGE_NAME"

            docker push "$IMAGE_NAME:latest"
          done

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CommerceFlow

            docker compose pull

            docker compose up -d

            docker compose ps

  deploy-kubernetes:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.K8S_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CommerceFlow
            git pull origin main

            sudo k3s kubectl apply -f k8s/ -n commerceflow

            sudo k3s kubectl rollout status deployment/discovery-server -n commerceflow
            sudo k3s kubectl rollout status deployment/gateway-service -n commerceflow
            sudo k3s kubectl rollout status deployment/product-service -n commerceflow
            sudo k3s kubectl rollout status deployment/order-service -n commerceflow
            sudo k3s kubectl rollout status deployment/inventory-service -n commerceflow
            sudo k3s kubectl rollout status deployment/payment-service -n commerceflow

            sudo k3s kubectl get pods -n commerceflow