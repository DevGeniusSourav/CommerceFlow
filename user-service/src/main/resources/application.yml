server:
  port: 8084

spring:
  application:
    name: user-service

  datasource:
#    url: jdbc:postgresql://localhost:5432/commerceflow_user?connectionTimeZone=UTC
    url: jdbc:postgresql://postgres:5432/commerceflow_user?connectionTimeZone=UTC
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
#      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true